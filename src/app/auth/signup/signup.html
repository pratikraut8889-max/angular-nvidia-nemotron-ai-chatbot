<div
  class="flex flex-col relative p-2 h-[100vh] w-full bg-gray-100 items-center justify-center overflow-hidden"
>
  <form
    [formRoot]="signupForm"
    (ngSubmit)="submit()"
    class="flex flex-col gap-4 w-full max-w-md mx-auto p-4 border border-gray-300 rounded-lg shadow-md"
  >
    <h2 class="text-2xl font-bold mb-4">
      Sign Up your account
    </h2>

    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Name</mat-label>

      <input
        matInput
        autocomplete="name"
        [formField]="signupForm.name"
        placeholder="Enter your name"
      />
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Email</mat-label>

      <input
        matInput
        type="email"
        autocomplete="email"
        [formField]="signupForm.email"
        placeholder="Enter your email"
      />
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Password</mat-label>

      <input
        matInput
        type="password"
        autocomplete="new-password"
        [formField]="signupForm.password"
        placeholder="Enter your password"
      />
    </mat-form-field>

    <a
      routerLink="/login"
      class="text-blue-500 hover:text-blue-700"
    >
      Already have an account? Log in here.
    </a>

    @if (error()) {
      <p
        role="alert"
        class="text-sm text-red-700"
      >
        {{ error() }}
      </p>
    }

    <button
      mat-flat-button
      color="primary"
      type="submit"
      [disabled]="loading()"
    >
      {{ loading() ? 'Creating account...' : 'Sign Up' }}
    </button>
  </form>
</div>
